name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 1. 모든 OS에서 빌드·린트·단위 테스트
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p st-cli -p st-gui

  # 2. Windows 가상 머신에서 실제 기록을 만들고, 도구 결과를 정답과 대조
  windows-truth:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p st-cli -p st-gui
      - name: 실행 파일 아이콘 확인
        run: python tools/check_icon.py assets/icon.ico target/release/SecuridgeTrace.exe target/release/trace.exe

      - name: 정답이 있는 실제 기록 만들기
        shell: pwsh
        run: ./ci/win-setup-truth.ps1 -TruthPath D:\st-truth.json -SampleDir D:\st-samples

      - name: Securidge Trace로 C 드라이브 분석
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\st-out | Out-Null
          & .\target\release\trace.exe analyze --input C:\ --output D:\st-out --case "gha-${{ matrix.os }}" --analyst ci --lang ko
          $code = $LASTEXITCODE
          Write-Host "종료 코드: $code"
          if ($code -ne 0 -and $code -ne 2) { exit 1 }
          exit 0

      - name: 정답과 대조
        shell: pwsh
        run: |
          $dir = Get-ChildItem D:\st-out -Directory | Sort-Object Name | Select-Object -Last 1
          python ci/verify_truth.py D:\st-truth.json $dir.FullName D:\st-summary.md
          $code = $LASTEXITCODE
          Get-Content D:\st-summary.md -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: 정답 하이브 (USB·휴대 장치·블루투스·네트워크) 만들고 대조
        shell: pwsh
        run: |
          ./ci/win-fake-hives.ps1 -Out D:\fake
          & .\target\release\trace.exe analyze --input D:\fake --output D:\st-fake --case fake --lang ko
          $dir = Get-ChildItem D:\st-fake -Directory | Select-Object -Last 1
          python ci/verify_more.py fake D:\fake\fake-truth.json $dir.FullName D:\sum-fake.md
          $code = $LASTEXITCODE
          Get-Content D:\sum-fake.md -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: 이 PC 점검 실기 (로그 삭제·시계 변경 후 trace check)
        shell: pwsh
        run: |
          ./ci/win-live-setup.ps1 -Truth D:\live-truth.json
          & .\target\release\trace.exe check --i-am-authorized --output D:\st-live --case gha-live --lang ko
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { exit 1 }
          $dir = Get-ChildItem D:\st-live -Directory | Select-Object -Last 1
          python ci/verify_more.py live D:\live-truth.json $dir.FullName D:\sum-live.md
          $code = $LASTEXITCODE
          Get-Content D:\sum-live.md -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: SRUM 데이터베이스 직접 읽어 보기
        shell: pwsh
        run: |
          esentutl /y C:\Windows\System32\sru\SRUDB.dat /vss /d D:\srum-copy.dat | Out-Null
          cargo run --release -p st-parsers --example probe_srum -- D:\srum-copy.dat

      - name: 화면 프로그램 실행 확인
        shell: pwsh
        run: ./ci/win-gui-smoke.ps1 -Exe "$pwd\target\release\SecuridgeTrace.exe" -Shot D:\gui.jpg

      - name: 실제 샘플을 로그로 내보내기 (결과물 다운로드가 막힌 환경용)
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- Recent 폴더 목록 ---"
          Get-ChildItem -Force ([Environment]::GetFolderPath('Recent')) | Select-Object Name, Length, LastWriteTimeUtc | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if (Test-Path D:\st-samples) {
            Get-ChildItem D:\st-samples -File | ForEach-Object {
              $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
              Write-Host "ST-SAMPLE-BEGIN $($_.Name)"
              for ($i = 0; $i -lt $b64.Length; $i += 1000) { Write-Host $b64.Substring($i, [Math]::Min(1000, $b64.Length - $i)) }
              Write-Host "ST-SAMPLE-END"
            }
          }

      - name: 결과 모으기
        if: always()
        shell: pwsh
        run: |
          $dst = Join-Path $env:GITHUB_WORKSPACE 'st-artifacts'
          New-Item -ItemType Directory -Force $dst | Out-Null
          foreach ($p in 'D:\st-truth.json','D:\st-summary.md','D:\st-samples','D:\st-out') {
            if (Test-Path $p) { Copy-Item -Recurse -Force $p $dst }
          }

      - name: 결과와 실제 샘플 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-${{ matrix.os }}
          path: st-artifacts
