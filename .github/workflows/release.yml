# Windows용 배포 파일을 만들어 GitHub 릴리스에 올린다.
# - `release` 브랜치에 올리면: Cargo.toml의 버전으로 태그(v<버전>)와 릴리스를 만든다.
# - `v`로 시작하는 태그를 올려도 같은 일을 한다.
name: release

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p st-cli -p st-gui

      - name: 버전 정하기
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $ver = "v" + $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $ver) {
            throw "태그(${{ github.ref_name }})와 Cargo.toml 버전($ver)이 다릅니다."
          }
          "VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "버전: $ver"

      - name: 배포 파일 만들기
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $name = "SecuridgeTrace-$ver-windows-x64"
          $dir = Join-Path $pwd "out\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\SecuridgeTrace.exe, target\release\trace.exe $dir
          Copy-Item dist\*.txt, LICENSE-MIT, LICENSE-APACHE $dir
          python tools/third_party.py (Join-Path $dir 'THIRD-PARTY-LICENSES.txt')
          if ($LASTEXITCODE -ne 0) { throw '외부 라이브러리 목록을 만들지 못함' }
          $zip = Join-Path $pwd "out\$name.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "out\$name.zip.sha256"
          # 버전 없는 이름도 함께 올린다: README의 "최신 버전 내려받기" 고정 링크용
          Copy-Item $zip "out\SecuridgeTrace-windows-x64.zip"
          "$h  SecuridgeTrace-windows-x64.zip" | Out-File -Encoding ascii "out\SecuridgeTrace-windows-x64.zip.sha256"
          python tools/check_icon.py assets/icon.ico target/release/SecuridgeTrace.exe target/release/trace.exe
          if ($LASTEXITCODE -ne 0) { throw '실행 파일에 아이콘이 없음' }
          Get-ChildItem out | Format-Table Name, Length | Out-Host
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SUM=out\$name.zip.sha256" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: GitHub 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Securidge Trace ${{ env.VERSION }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            ${{ env.ZIP }}
            ${{ env.SUM }}
            out/SecuridgeTrace-windows-x64.zip
            out/SecuridgeTrace-windows-x64.zip.sha256
